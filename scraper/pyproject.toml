[project]
name = "scraper"
version = "0.0.1"
description = "Virtustec virtual sports data collection scraper"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.13.0",
]

[project.scripts]
scraper = "scraper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
