paths:
  data_dir: ./data
  profile_dir: ./browser_profile
  captures_dir: ./data/captures
  log_dir: ./logs

capture:
  parent_url: "https://www.sportybet.com/ng/virtual"
  enabled_products: [football, dogs, horses, speedway, motorbikes]
  ignore_resources: [/tickets/findByTime]
  recovery:
    death_401_threshold: 5
    death_window_seconds: 60
    healthy_after_recovery_seconds: 30
    max_recoveries_per_hour: 6
  rotation:
    daily: true
  headless: false

database:
  url: "sqlite:///./data/scraper.db"
  # url: "postgresql+psycopg://user:pass@host/db"

parse:
  batch_size: 1000
  on_conflict: replace
  season_detector:
    require_standings_reset: true

api:
  host: "127.0.0.1"
  port: 8000

monitor:
  watchdog_interval_seconds: 60
  thresholds:
    min_frames_per_min: 10
    min_events_per_hour: 30
    parser_watermark_stale_seconds: 900

alerts:
  default_severity_min: warning
  channels:
    - kind: telegram
      enabled: true
      severity_min: info
    - kind: discord
      enabled: false
      severity_min: warning
    - kind: email
      enabled: false
      severity_min: critical
    - kind: slack
      enabled: false
      severity_min: warning
    - kind: console
      enabled: true
      severity_min: info
